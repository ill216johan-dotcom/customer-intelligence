# version: '3.8'

services:
  # ==========================================
  # PostgreSQL + pgvector
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ci_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict with local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ci_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis (для Celery)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ci-redis
    restart: unless-stopped
    # ports:          <-- Commented out to avoid conflict
    #   - "6379:6379"
    volumes:
      - redis_data:/data

  # ==========================================
  # FastAPI Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ci-backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-customer_intelligence}
      - POSTGRES_USER=${POSTGRES_USER:-ci_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - REDIS_URL=redis://redis:6379/0
      - GLM_API_KEY=${GLM_API_KEY}
      - BACKEND_SECRET_KEY=${BACKEND_SECRET_KEY:-dev_secret_key}
    volumes:
      - ./backend/app:/app/app
      - audio_data:/app/audio
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ==========================================
  # Celery Worker (тяжёлые задачи: Whisper, etc.)
  # ==========================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: ci-worker
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-customer_intelligence}
      - POSTGRES_USER=${POSTGRES_USER:-ci_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - REDIS_URL=redis://redis:6379/0
      - GLM_API_KEY=${GLM_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}  # Changed from large-v3 to small for better memory usage
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
    volumes:
      - ./worker:/app
      - audio_data:/app/audio
      - whisper_cache:/root/.cache
    depends_on:
      - redis
      - postgres

  # ==========================================
  # Next.js Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ci-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ==========================================
  # n8n (автоматизация)
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: ci-n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-change_me}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  # ==========================================
  # Nginx (reverse proxy) - для production
  # ==========================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: ci-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  postgres_data:
  redis_data:
  audio_data:
  whisper_cache:
  n8n_data:
